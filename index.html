<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Suivi de production</title>
<meta name="theme-color" content="#14171A" />
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" type="image/png" href="favicon.png"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  :root{
    --base:#14171A; --surface:#1E2227; --border:#333940;
    --text:#ECE9E4; --muted:#8B9198; --accent:#3B82C4;
    --ok:#4ADE80; --nok:#E5484D; --warn:#F2A93B;
  }
  html,body{background:var(--base);color:var(--text);font-family:'Inter',sans-serif;margin:0;min-height:100vh;}
  h1,h2,h3{font-family:'Oswald',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  textarea{font-family:'JetBrains Mono',monospace;}
  @keyframes decapus-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes decapus-glow{0%,100%{box-shadow:0 8px 20px rgba(0,0,0,.45),0 0 0 2px rgba(246,173,85,.25)}50%{box-shadow:0 20px 28px rgba(0,0,0,.3),0 0 0 3px rgba(246,173,85,.45)}}
  .decapus-logo{width:96px;height:96px;border-radius:24px;display:block;animation:decapus-float 3.4s ease-in-out infinite,decapus-glow 3.4s ease-in-out infinite;}
  @media (prefers-reduced-motion:reduce){.decapus-logo{animation:none}}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, setDoc, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ---------- Connexion Firebase (synchronisation temps réel entre tous les appareils) ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyCfIqxDuXC2bm3jerrHUxo3yraS11ShRv0",
  authDomain: "suivi-indicateurs-ad178.firebaseapp.com",
  projectId: "suivi-indicateurs-ad178",
  storageBucket: "suivi-indicateurs-ad178.firebasestorage.app",
  messagingSenderId: "465770742064",
  appId: "1:465770742064:web:3869a5dbcf4ea326da48f5",
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const docRef = doc(db, "app", "production-lines");
const supRef = doc(db, "app", "supervisors"); // liste des superviseurs (document séparé)

/* ---------- Données ---------- */
const DEFAULT_INDICATORS = ["État 5S", "Connexion ESD", "Affichage E/S", "Traçabilité", "Sécurité machine"];
const SHIFTS = ["Shift 1", "Shift 2", "Shift 3"];
/* Horaires des shifts (heure locale de l'appareil) : [heure de début, heure de fin]. Modifiables ici. */
const SHIFT_HOURS = { "Shift 1":[6,14], "Shift 2":[14,22], "Shift 3":[22,6] };
function currentShift(d = new Date()){
  const h = d.getHours() + d.getMinutes()/60;
  for (const s of SHIFTS){ const [a,b] = SHIFT_HOURS[s]; if (a < b ? (h >= a && h < b) : (h >= a || h < b)) return s; }
  return SHIFTS[0];
}
function shiftHoursLabel(s){ const [a,b] = SHIFT_HOURS[s]; return `${String(a).padStart(2,"0")}h–${String(b).padStart(2,"0")}h`; }

function makeShiftIndicators(posteId, shift, names){
  names = names || DEFAULT_INDICATORS;
  return names.map((name, idx) => ({ id:`${posteId}-${shift.replace(/\s+/g,"")}-I${idx}-${Date.now()}${idx}`, name, status:"OK" }));
}

/* Liste de tous les noms d'indicateurs actuellement utilisés dans l'application (ordre stable) */
function allIndicatorNames(){
  const order = [];
  const seen = new Set();
  DEFAULT_INDICATORS.forEach(n => { order.push(n); seen.add(n); });
  STATE.lines.forEach(l => l.postes.forEach(p => SHIFTS.forEach(s =>
    (p.shifts[s]||[]).forEach(i => { if (!seen.has(i.name)) { seen.add(i.name); order.push(i.name); } })
  )));
  return order.filter(n => STATE.lines.some(l => l.postes.some(p => SHIFTS.some(s => (p.shifts[s]||[]).some(i => i.name === n)))));
}

function seedLines(){
  const defs = [
    {id:"L1", name:"Ligne 1", subtitle:"Assemblage", postes:4},
    {id:"L2", name:"Ligne 2", subtitle:"Câblage", postes:3},
    {id:"L3", name:"Ligne 3", subtitle:"Test & Contrôle", postes:5},
    {id:"L4", name:"Ligne 4", subtitle:"Emballage", postes:3},
  ];
  return defs.map(line => ({
    id: line.id, name: line.name, subtitle: line.subtitle,
    postes: Array.from({length: line.postes}, (_, i) => {
      const posteId = `${line.id}-P${i+1}`;
      const shifts = {};
      SHIFTS.forEach(s => { shifts[s] = makeShiftIndicators(posteId, s); });
      return { id: posteId, name: `Poste ${i+1}`, shifts };
    })
  }));
}

/* Convertit d'anciennes données (indicateurs uniques, sans shift) vers la structure par shift */
function normalizeLines(lines){
  return (lines || []).map(line => ({
    ...line,
    postes: (line.postes || []).map(poste => {
      if (poste.shifts) return poste;
      const shifts = {};
      SHIFTS.forEach(s => {
        shifts[s] = (poste.indicators || DEFAULT_INDICATORS.map(n=>({name:n,status:"OK"})))
          .map((ind, idx) => ({ id: `${poste.id}-${s.replace(/\s+/g,"")}-I${idx}`, name: ind.name, status: ind.status || "OK" }));
      });
      const { indicators, ...rest } = poste;
      return { ...rest, shifts };
    })
  }));
}

/* ---------- Accès superviseur / opérateur ---------- */
const ROLE_KEY = "suivi-production-role";
const SHIFT_KEY = "suivi-production-shift";

/* ---------- État de l'application ---------- */
const HISTORY_LIMIT = 300;
const ACCESS_LOG_LIMIT = 300;
const ADMIN_EMAIL = "mmedamine160@gmail.com";
/* Administrateur : e-mail + code admin secret (seule l'empreinte du code est stockée ici).
   Superviseurs : créés par l'admin (nom + code d'accès), stockés sous forme d'empreintes. */
const ADMIN_SALT = "2f2b26a368e3aa847e170f8934be946e";
const ADMIN_CODE_HASH = "4ad99c66dc94fa7348c47bbbda9e496437de889cbbb24d638a6b8907df6851f3";
const LOGIN_LOCK_KEY = "suivi-production-login-lock";
async function hashCode(code, salt){
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", enc.encode(code), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name:"PBKDF2", salt: enc.encode(salt), iterations:100000, hash:"SHA-256" }, key, 256);
  return Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2,"0")).join("");
}
/* Tout superviseur (admin compris) peut créer / modifier / supprimer lignes, postes et indicateurs.
   Seul l'admin gère la liste des superviseurs. */
function canEdit(){ return STATE.role === "superviseur"; }
let STATE = {
  lines: [],
  history: [], // journal des passages OK/NOK
  accessLog: [], // journal des connexions superviseur (nom, e-mail, date)
  supervisors: [], // [{id, name, salt, hash, createdAt}] — géré par l'admin
  supervisorId: null,
  loginMode: "sup", // "sup" | "admin"
  supError: "",
  svName: "", svCode: "", // brouillon du formulaire « nouveau superviseur » (conservé en cas d'erreur)
  loginName: "", loginEmail: "",
  supOk: "",
  loading: true,
  connError: "",
  role: localStorage.getItem(ROLE_KEY) === "operateur" ? "operateur" : null, // seul l'opérateur reste connecté ; le superviseur se reconnecte à chaque fois
  shift: currentShift(), // automatique selon l'heure actuelle (voir SHIFT_HOURS)
  identified: false, // le superviseur doit s'identifier (nom + e-mail) à chaque connexion
  supervisorName: "",
  supervisorEmail: "",
  isAdmin: false,
  loginError: "",
  identifyError: "",
  view: { screen: "home", lineId: null, posteId: null },
  modal: null,
};

/* Écoute en temps réel : toute modification faite sur un autre appareil arrive ici automatiquement */
onSnapshot(docRef, (snap) => {
  if (snap.exists() && snap.data().json) {
    try {
      const raw = JSON.parse(snap.data().json);
      if (Array.isArray(raw)) {
        // Ancien format : le document ne contenait que le tableau des lignes
        STATE.lines = normalizeLines(raw);
        STATE.history = [];
        STATE.accessLog = [];
      } else {
        STATE.lines = normalizeLines(raw.lines || []);
        STATE.history = raw.history || [];
        STATE.accessLog = raw.accessLog || [];
      }
    } catch(e) { /* ignore malformed payload */ }
  } else {
    const seeded = seedLines();
    STATE.lines = seeded;
    STATE.history = [];
    STATE.accessLog = [];
    setDoc(docRef, { json: JSON.stringify({ lines: seeded, history: [], accessLog: [] }), updatedAt: serverTimestamp() }).catch(()=>{});
  }
  STATE.loading = false;
  STATE.connError = "";
  render();
}, (error) => {
  STATE.loading = false;
  STATE.connError = (error && error.message) || "Connexion à la base de données impossible.";
  render();
});

/* Liste des superviseurs, en temps réel : si l'admin retire un superviseur, il est déconnecté */
onSnapshot(supRef, (snap) => {
  let list = [];
  try { if (snap.exists() && snap.data().json) list = JSON.parse(snap.data().json).list || []; } catch(e) {}
  STATE.supervisors = list;
  if (STATE.role === "superviseur" && !STATE.isAdmin && !list.some(x => x.id === STATE.supervisorId)) {
    STATE.role = null; STATE.identified = false; STATE.supervisorName = ""; STATE.supervisorId = null;
    STATE.view = { screen:"home", lineId:null, posteId:null }; STATE.modal = null;
    STATE.loginError = "Votre accès superviseur a été retiré par l'administrateur.";
  }
  render();
}, () => {});

function setState(patch){ Object.assign(STATE, patch); render(); }
function navigate(view){
  // Un opérateur ne peut pas accéder au tableau de bord ; le journal des connexions est réservé à l'admin
  if ((view.screen === "dashboard" || view.screen === "stats" || view.screen === "history") && STATE.role !== "superviseur") return;
  if (view.screen === "access-log" && STATE.role !== "superviseur") return;
  if (view.screen === "supervisors" && !STATE.isAdmin) return;
  setState({ view });
}
function openModal(modal){
  // Ajout/modification de lignes et postes réservés au superviseur ; motif NOK réservé à l'opérateur
  if (["add-line","edit-line","edit-poste","add-poste","manage-indicators"].includes(modal.type) && !canEdit()) return;
  if (modal.type === "nok-reason" && STATE.role !== "operateur") return;
  setState({ modal });
}
function closeModal(){ setState({ modal: null }); }
function loginAsOperateur(){
  localStorage.setItem(ROLE_KEY, "operateur");
  setState({ role: "operateur", loginError: "" });
}
/* Anti-force-brute : 5 essais ratés = blocage de 60 secondes sur cet appareil */
function loginLocked(){
  let until = 0; try { until = +localStorage.getItem(LOGIN_LOCK_KEY) || 0; } catch(e) {}
  return until > Date.now() ? Math.ceil((until - Date.now())/1000) : 0;
}
let loginFails = 0;
function loginFailed(msg){
  loginFails++;
  if (loginFails >= 5) { loginFails = 0; try { localStorage.setItem(LOGIN_LOCK_KEY, String(Date.now() + 60000)); } catch(e) {} msg = "Trop d'essais. Réessayez dans 60 secondes."; }
  setState({ loginError: msg });
}
function openSupervisorSession({ name, email, isAdmin, id }){
  STATE.identified = true;
  STATE.supervisorName = name;
  STATE.supervisorEmail = email || "";
  STATE.supervisorId = id || null;
  STATE.loginName = ""; STATE.loginEmail = "";
  STATE.isAdmin = isAdmin;
  STATE.loginError = "";
  const next = [...STATE.accessLog, { id:`A${Date.now()}${Math.random().toString(36).slice(2,6)}`, ts:new Date().toISOString(), name, email: email || "", isAdmin }];
  STATE.accessLog = next.length > ACCESS_LOG_LIMIT ? next.slice(next.length - ACCESS_LOG_LIMIT) : next;
  STATE.role = "superviseur";
  STATE.view = { screen:"home", lineId:null, posteId:null };
  writeState();
}
async function tryLoginSuperviseur(name, code){
  const wait = loginLocked();
  if (wait) { setState({ loginError: `Trop d'essais. Réessayez dans ${wait} s.` }); return; }
  const n = (name||"").trim(), c = (code||"").trim();
  STATE.loginName = n;
  if (!n || !c) { setState({ loginError: "Saisissez votre nom et votre code d'accès." }); return; }
  const sup = STATE.supervisors.find(x => x.name.trim().toLowerCase() === n.toLowerCase());
  let ok = false;
  if (sup) { try { ok = (await hashCode(c, sup.salt)) === sup.hash; } catch(e) {} }
  if (!ok) { loginFailed("Nom ou code d'accès incorrect."); return; }
  loginFails = 0;
  openSupervisorSession({ name: sup.name, isAdmin:false, id: sup.id });
}
async function tryLoginAdmin(email, code){
  const wait = loginLocked();
  if (wait) { setState({ loginError: `Trop d'essais. Réessayez dans ${wait} s.` }); return; }
  const e = (email||"").trim().toLowerCase(), c = (code||"").trim();
  STATE.loginEmail = (email||"").trim();
  let ok = false;
  if (e && c && e === ADMIN_EMAIL.toLowerCase()) { try { ok = (await hashCode(c, ADMIN_SALT)) === ADMIN_CODE_HASH; } catch(err) {} }
  if (!ok) { loginFailed("E-mail ou code admin incorrect."); return; }
  loginFails = 0;
  openSupervisorSession({ name:"Administrateur", email: ADMIN_EMAIL, isAdmin:true, id:"admin" });
}

/* ---------- Gestion des superviseurs (admin uniquement) ---------- */
function writeSupervisors(list){
  STATE.supervisors = list;
  render();
  setDoc(supRef, { json: JSON.stringify({ list }), updatedAt: serverTimestamp() })
    .catch((err) => { STATE.supError = (err && err.message) || "Échec de l'enregistrement."; render(); });
}
async function addSupervisor(name, code){
  if (!STATE.isAdmin) return;
  const n = (name||"").trim(), c = (code||"").trim();
  STATE.svName = n; STATE.svCode = c;
  if (n.length < 2) { setState({ supError:"Saisissez le nom du superviseur (2 caractères minimum).", supOk:"" }); return; }
  if (c.length < 4) { setState({ supError:"Le code d'accès doit faire 4 caractères minimum.", supOk:"" }); return; }
  if (STATE.supervisors.some(x => x.name.trim().toLowerCase() === n.toLowerCase())) { setState({ supError:"Un superviseur porte déjà ce nom.", supOk:"" }); return; }
  const salt = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b => b.toString(16).padStart(2,"0")).join("");
  const hash = await hashCode(c, salt);
  STATE.svName = ""; STATE.svCode = "";
  STATE.supError = ""; STATE.supOk = `« ${n} » ajouté. Communiquez-lui son code d'accès.`;
  writeSupervisors([...STATE.supervisors, { id:`S${Date.now()}${Math.random().toString(36).slice(2,6)}`, name:n, salt, hash, createdAt:new Date().toISOString() }]);
}
function deleteSupervisor(id){
  if (!STATE.isAdmin) return;
  const sup = STATE.supervisors.find(x => x.id === id);
  if (!sup) return;
  if (!confirm(`Retirer l'accès du superviseur « ${sup.name} » ?`)) return;
  STATE.supError = ""; STATE.supOk = `« ${sup.name} » retiré.`;
  writeSupervisors(STATE.supervisors.filter(x => x.id !== id));
}
function chooseShift(shift){
  localStorage.setItem(SHIFT_KEY, shift);
  setState({ shift });
}
function confirmIdentity(name, email){
  const n = (name||"").trim(), e = (email||"").trim();
  if (!n || !e || !e.includes("@")) {
    setState({ identifyError: "Merci de renseigner un nom et un e-mail valide." });
    return;
  }
  const isAdmin = e.toLowerCase() === ADMIN_EMAIL;
  STATE.identified = true;
  STATE.supervisorName = n;
  STATE.supervisorEmail = e;
  STATE.isAdmin = isAdmin;
  STATE.identifyError = "";
  const next = [...STATE.accessLog, { id:`A${Date.now()}${Math.random().toString(36).slice(2,6)}`, ts:new Date().toISOString(), name:n, email:e, isAdmin }];
  STATE.accessLog = next.length > ACCESS_LOG_LIMIT ? next.slice(next.length - ACCESS_LOG_LIMIT) : next;
  writeState();
}
function logout(){
  localStorage.removeItem(ROLE_KEY);
  localStorage.removeItem(SHIFT_KEY);
  setState({ role: null, shift: null, identified:false, supervisorName:"", supervisorEmail:"", isAdmin:false, identifyError:"", loginName:"", loginEmail:"", loginError:"", loginMode:"sup", supError:"", supOk:"", svName:"", svCode:"", view: {screen:"home", lineId:null, posteId:null} });
}

/* Écrit l'état courant (lignes + historique) dans Firestore ; tous les appareils connectés reçoivent la mise à jour automatiquement */
function writeState(){
  render();
  const payload = { lines: STATE.lines, history: STATE.history, accessLog: STATE.accessLog };
  setDoc(docRef, { json: JSON.stringify(payload), updatedAt: serverTimestamp() })
    .then(() => { if (STATE.connError) { STATE.connError = ""; render(); } })
    .catch((err) => { STATE.connError = (err && err.message) || "Échec de la synchronisation."; render(); });
}
function persist(next){
  STATE.lines = next;
  writeState();
}
function addHistoryEntry(entry){
  const next = [...STATE.history, { id:`H${Date.now()}${Math.random().toString(36).slice(2,6)}`, ts:new Date().toISOString(), ...entry }];
  STATE.history = next.length > HISTORY_LIMIT ? next.slice(next.length - HISTORY_LIMIT) : next;
}

/* ---------- Helpers métier ---------- */
function posteIndicators(poste){
  // Tous les indicateurs de tous les shifts d'un poste, à plat
  return SHIFTS.flatMap(s => (poste.shifts[s] || []).map(i => ({...i, shift:s})));
}
function nokCount(line){
  return line.postes.reduce((acc,p)=> acc + posteIndicators(p).filter(i=>i.status==="NOK").length, 0);
}
function posteHasNok(poste){ return posteIndicators(poste).some(i=>i.status==="NOK"); }
function shiftHasNok(poste, shift){ return (poste.shifts[shift]||[]).some(i=>i.status==="NOK"); }
function getAllAnomalies(lines){
  const out = [];
  lines.forEach(line => line.postes.forEach(poste => posteIndicators(poste).forEach(ind => {
    if (ind.status === "NOK") out.push({lineId:line.id, lineName:line.name, posteId:poste.id, posteName:poste.name, indicatorId:ind.id, indicatorName:ind.name, shift:ind.shift});
  })));
  return out;
}
function findLine(id){ return STATE.lines.find(l=>l.id===id) || null; }
function findPoste(lineId, posteId){ const l = findLine(lineId); return l ? l.postes.find(p=>p.id===posteId) : null; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function formatDuration(ms){
  if (ms == null || ms < 0) return "—";
  const min = Math.round(ms / 60000);
  if (min < 1) return "< 1 min";
  if (min < 60) return `${min} min`;
  const h = Math.floor(min / 60), m = min % 60;
  if (h < 24) return `${h} h${m ? ` ${m} min` : ""}`;
  const d = Math.floor(h / 24), rh = h % 24;
  return `${d} j${rh ? ` ${rh} h` : ""}`;
}
function formatElapsed(iso){ return formatDuration(Date.now() - new Date(iso).getTime()); }
function formatDateTime(iso){
  const d = new Date(iso);
  return d.toLocaleString("fr-FR", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
}

/* ---------- Actions ---------- */
function findIndicator(lineId, posteId, shift, indicatorId){
  const p = findPoste(lineId, posteId);
  if (!p) return null;
  return (p.shifts[shift] || []).find(i => i.id === indicatorId) || null;
}
function updateIndicator(lineId, posteId, shift, indicatorId, patch){
  return STATE.lines.map(line => {
    if (line.id !== lineId) return line;
    return { ...line, postes: line.postes.map(p => {
      if (p.id !== posteId) return p;
      return { ...p, shifts: { ...p.shifts, [shift]: p.shifts[shift].map(i => i.id===indicatorId ? {...i, ...patch} : i) } };
    })};
  });
}
/* Clic sur un indicateur OK : demande un motif obligatoire avant de passer en NOK */
function requestNok(lineId, posteId, shift, indicatorId){
  if (STATE.role !== "operateur" || shift !== currentShift()) return;
  openModal({ type:"nok-reason", lineId, posteId, shift, indicatorId });
}
function confirmNok(lineId, posteId, shift, indicatorId, comment){
  if (STATE.role !== "operateur" || shift !== currentShift()) { STATE.modal = null; render(); alert("Ce shift est terminé : vous ne pouvez modifier que le shift en cours."); return; }
  const trimmed = (comment||"").trim();
  if (!trimmed) { alert("Un motif est obligatoire pour déclarer une anomalie."); return; }
  const line = findLine(lineId), poste = findPoste(lineId, posteId), ind = findIndicator(lineId, posteId, shift, indicatorId);
  if (!line || !poste || !ind) return;
  const now = new Date().toISOString();
  const next = updateIndicator(lineId, posteId, shift, indicatorId, { status:"NOK", comment: trimmed, openedAt: now });
  STATE.lines = next;
  addHistoryEntry({ lineId, lineName:line.name, posteId, posteName:poste.name, shift, indicatorName:ind.name, action:"NOK", comment: trimmed });
  STATE.modal = null;
  writeState();
}
/* Clic sur un indicateur NOK : repasse en OK directement, calcule et journalise la durée de résolution */
function resolveOk(lineId, posteId, shift, indicatorId){
  if (STATE.role !== "operateur" || shift !== currentShift()) return;
  const line = findLine(lineId), poste = findPoste(lineId, posteId), ind = findIndicator(lineId, posteId, shift, indicatorId);
  if (!line || !poste || !ind || ind.status !== "NOK") return;
  const durationMs = ind.openedAt ? (Date.now() - new Date(ind.openedAt).getTime()) : null;
  const next = updateIndicator(lineId, posteId, shift, indicatorId, { status:"OK", comment:null, openedAt:null });
  STATE.lines = next;
  addHistoryEntry({ lineId, lineName:line.name, posteId, posteName:poste.name, shift, indicatorName:ind.name, action:"OK", durationMs });
  writeState();
}
function renameLine(lineId, name, subtitle){
  if (!canEdit()) return;
  persist(STATE.lines.map(l => l.id===lineId ? {...l, name, subtitle} : l));
  closeModal();
}
function renamePoste(lineId, posteId, name){
  if (!canEdit()) return;
  persist(STATE.lines.map(l => l.id!==lineId ? l : {...l, postes: l.postes.map(p=>p.id===posteId?{...p,name}:p)}));
  closeModal();
}
function addLine(name, subtitle){
  if (!canEdit()) return;
  const id = `L${Date.now()}`;
  persist([...STATE.lines, {id, name, subtitle, postes: []}]);
  closeModal();
}
function deleteLine(lineId){
  if (!canEdit()) return;
  const l = findLine(lineId);
  if (!l) return;
  if (!confirm(`Supprimer la ligne « ${l.name} » et tous ses postes ? Cette action est irréversible.`)) return;
  persist(STATE.lines.filter(x => x.id !== lineId));
  if (STATE.view.lineId === lineId) navigate({screen:"home", lineId:null, posteId:null});
}
function addPoste(lineId, name){
  if (!canEdit()) return;
  const id = `${lineId}-P${Date.now()}`;
  const names = allIndicatorNames();
  const shifts = {};
  SHIFTS.forEach(s => { shifts[s] = makeShiftIndicators(id, s, names); });
  const newPoste = { id, name, shifts };
  persist(STATE.lines.map(l => l.id===lineId ? {...l, postes:[...l.postes, newPoste]} : l));
  closeModal();
}
function deletePoste(lineId, posteId){
  if (!canEdit()) return;
  const p = findPoste(lineId, posteId);
  if (!p) return;
  if (!confirm(`Supprimer le poste « ${p.name} » ? Cette action est irréversible.`)) return;
  persist(STATE.lines.map(l => l.id!==lineId ? l : {...l, postes: l.postes.filter(x=>x.id!==posteId)}));
  if (STATE.view.posteId === posteId) navigate({screen:"line", lineId, posteId:null});
}

/* ---------- Gestion des types d'indicateurs (superviseur) : s'applique à tous les postes ---------- */
function addIndicatorType(name){
  if (!canEdit()) return;
  const trimmed = (name||"").trim();
  if (!trimmed) return;
  if (allIndicatorNames().includes(trimmed)) return;
  const next = STATE.lines.map(line => ({
    ...line,
    postes: line.postes.map(p => {
      const shifts = {};
      SHIFTS.forEach(s => {
        const arr = p.shifts[s] || [];
        shifts[s] = [...arr, { id:`${p.id}-${s.replace(/\s+/g,"")}-N${Date.now()}${Math.random().toString(36).slice(2,6)}`, name: trimmed, status:"OK" }];
      });
      return { ...p, shifts };
    })
  }));
  persist(next);
}
function renameIndicatorType(oldName, newName){
  if (!canEdit()) return;
  const trimmed = (newName||"").trim();
  if (!trimmed || trimmed === oldName) return;
  const next = STATE.lines.map(line => ({
    ...line,
    postes: line.postes.map(p => {
      const shifts = {};
      SHIFTS.forEach(s => { shifts[s] = (p.shifts[s]||[]).map(i => i.name===oldName ? {...i, name:trimmed} : i); });
      return { ...p, shifts };
    })
  }));
  persist(next);
}
function deleteIndicatorType(name){
  if (!canEdit()) return;
  if (allIndicatorNames().length <= 1) { alert("Il doit rester au moins un indicateur."); return; }
  if (!confirm(`Supprimer l'indicateur « ${name} » de tous les postes et tous les shifts ? Cette action est irréversible.`)) return;
  const next = STATE.lines.map(line => ({
    ...line,
    postes: line.postes.map(p => {
      const shifts = {};
      SHIFTS.forEach(s => { shifts[s] = (p.shifts[s]||[]).filter(i => i.name !== name); });
      return { ...p, shifts };
    })
  }));
  persist(next);
}

/* ---------- Rendu ---------- */
function render(){
  const app = document.getElementById("app");
  if (STATE.loading) {
    app.innerHTML = `<div class="min-h-screen flex items-center justify-center gap-3" style="color:var(--muted);">
      <i data-lucide="loader-2" class="animate-spin" width="20" height="20"></i><span>Connexion…</span></div>`;
    if (window.lucide) lucide.createIcons();
    return;
  }
  if (!STATE.role) {
    app.innerHTML = loginView();
    if (window.lucide) lucide.createIcons();
    wireEvents();
    return;
  }
  if (STATE.role === "operateur") STATE.shift = currentShift(); // le shift suit l'heure actuelle
  if (STATE.role === "operateur" && !STATE.shift) {
    app.innerHTML = shiftView();
    if (window.lucide) lucide.createIcons();
    wireEvents();
    return;
  }
  if (STATE.role === "superviseur" && !STATE.identified) {
    app.innerHTML = identifyView();
    if (window.lucide) lucide.createIcons();
    wireEvents();
    return;
  }
  app.innerHTML = header() + connBanner() + body() + modalHtml();
  if (window.lucide) lucide.createIcons();
  wireEvents();
}

function header(){
  const v = STATE.view;
  let title = "Suivi de production";
  let subtitle = "";
  if (v.screen === "dashboard") title = "Tableau de bord";
  if (v.screen === "stats") title = "Statistiques";
  if (v.screen === "history") title = "Historique";
  if (v.screen === "access-log") title = "Connexions";
  if (v.screen === "supervisors") title = "Superviseurs";
  if (v.screen === "line") { const l = findLine(v.lineId); title = l ? l.name : ""; subtitle = l ? l.subtitle : ""; }
  if (v.screen === "poste") { const l = findLine(v.lineId); const p = findPoste(v.lineId, v.posteId); title = p ? p.name : ""; subtitle = l ? `${l.name} · ${l.subtitle}` : ""; }

  const backBtn = v.screen !== "home" ? `
    <button data-action="back" class="text-[var(--muted)] hover:text-white transition-colors p-1 -ml-1" aria-label="Retour">
      <i data-lucide="arrow-left" width="20" height="20"></i>
    </button>` : "";

  const topActions = (v.screen === "home" || v.screen === "dashboard" || v.screen === "stats" || v.screen === "history") && STATE.role === "superviseur" ? `
      <button data-action="goto-dashboard" class="text-sm rounded px-3 py-2 flex items-center gap-1.5 hover:brightness-110 ${v.screen==="dashboard" ? "" : "border"}"
        style="${v.screen==="dashboard" ? "background:var(--accent);color:#fff;" : "border-color:var(--border);color:var(--text);"}">
        <i data-lucide="layout-dashboard" width="16" height="16"></i> Tableau de bord
      </button>
      <button data-action="goto-stats" class="text-sm rounded px-3 py-2 flex items-center gap-1.5 hover:brightness-110 ${v.screen==="stats" ? "" : "border"}"
        style="${v.screen==="stats" ? "background:var(--accent);color:#fff;" : "border-color:var(--border);color:var(--text);"}">
        <i data-lucide="bar-chart-3" width="16" height="16"></i> Statistiques
      </button>
      <button data-action="goto-history" class="text-sm rounded px-3 py-2 flex items-center gap-1.5 hover:brightness-110 ${v.screen==="history" ? "" : "border"}"
        style="${v.screen==="history" ? "background:var(--accent);color:#fff;" : "border-color:var(--border);color:var(--text);"}">
        <i data-lucide="history" width="16" height="16"></i> Historique
      </button>
      ${v.screen === "home" && canEdit() ? `
      <button data-action="open-add-line" class="text-sm rounded px-3 py-2 flex items-center gap-1.5 hover:brightness-110" style="background:var(--accent);color:#fff;">
        <i data-lucide="plus" width="16" height="16"></i> Nouvelle ligne
      </button>` : ""}` : "";

  const indicatorsBtn = canEdit() ? `
      <button data-action="open-manage-indicators" class="text-sm rounded px-3 py-2 flex items-center gap-1.5 hover:brightness-110 border" style="border-color:var(--border);color:var(--text);" title="Gérer les indicateurs">
        <i data-lucide="list-checks" width="16" height="16"></i>
      </button>` : "";

  const supervisorsBtn = STATE.isAdmin ? `
      <button data-action="goto-supervisors" class="text-sm rounded px-3 py-2 flex items-center gap-1.5 hover:brightness-110 ${v.screen==="supervisors" ? "" : "border"}"
        style="${v.screen==="supervisors" ? "background:var(--accent);color:#fff;" : "border-color:var(--border);color:var(--text);"}" title="Gérer les superviseurs (admin)">
        <i data-lucide="users" width="16" height="16"></i>
      </button>` : "";

  const accessLogBtn = STATE.role === "superviseur" ? `
      <button data-action="goto-access-log" class="text-sm rounded px-3 py-2 flex items-center gap-1.5 hover:brightness-110 ${v.screen==="access-log" ? "" : "border"}"
        style="${v.screen==="access-log" ? "background:var(--accent);color:#fff;" : "border-color:var(--border);color:var(--text);"}" title="Journal des connexions">
        <i data-lucide="user-check" width="16" height="16"></i>
      </button>` : "";

  const roleBadge = `
    <span class="text-xs px-2 py-1 rounded flex items-center gap-1" style="color:var(--muted); border:1px solid var(--border);" title="${esc(STATE.role==='superviseur' ? STATE.supervisorName+' · '+STATE.supervisorEmail : '')}">
      <i data-lucide="${STATE.role === "superviseur" ? (STATE.isAdmin ? "crown" : "shield") : "user"}" width="12" height="12"></i>
      ${STATE.role === "superviseur" ? (STATE.isAdmin ? "Admin" : "Superviseur") : `Opérateur · ${esc(STATE.shift || "")}`}
    </span>
    <button data-action="logout" style="color:var(--muted);" class="hover:text-white transition-colors p-1" title="Changer de profil">
      <i data-lucide="log-out" width="16" height="16"></i>
    </button>`;

  const syncDot = STATE.connError
    ? `<span class="w-2 h-2 rounded-full" style="background:var(--nok);" title="Hors ligne"></span>`
    : `<span class="w-2 h-2 rounded-full" style="background:var(--ok); box-shadow:0 0 6px var(--ok);" title="Synchronisé en direct"></span>`;

  return `
  <header class="border-b sticky top-0 z-10 px-5 py-4 flex items-center gap-3" style="border-color:var(--border); background:var(--base);">
    ${backBtn}
    <i data-lucide="factory" width="20" height="20" style="color:var(--accent);"></i>
    <div>
      <h1 class="text-lg font-semibold uppercase leading-none flex items-center gap-2">${esc(title)} ${syncDot}</h1>
      ${subtitle ? `<p class="text-xs mt-1" style="color:var(--muted);">${esc(subtitle)}</p>` : ""}
    </div>
    <div class="ml-auto flex items-center gap-2">
      ${topActions}
      ${indicatorsBtn}
      ${supervisorsBtn}
      ${accessLogBtn}
      ${roleBadge}
    </div>
  </header>`;
}

function connBanner(){
  if (!STATE.connError) return "";
  return `
  <div class="mx-5 mt-4 border rounded px-3 py-2 text-xs flex items-center justify-between gap-2" style="background:#3A1F1F;color:var(--nok);border-color:var(--nok);">
    <span class="flex items-center gap-2"><i data-lucide="alert-triangle" width="14" height="14"></i> Hors ligne : ${esc(STATE.connError)}</span>
    <button data-action="retry-save" class="border rounded px-2 py-1 hover:brightness-125 whitespace-nowrap" style="border-color:var(--nok);">Réessayer</button>
  </div>`;
}

function body(){
  const v = STATE.view;
  if (v.screen === "home") return homeView();
  if (v.screen === "line") return lineView();
  if (v.screen === "poste") return posteView();
  if (v.screen === "dashboard") return dashboardView();
  if (v.screen === "stats") return statsView();
  if (v.screen === "history") return historyView();
  if (v.screen === "access-log") return accessLogView();
  if (v.screen === "supervisors") return supervisorsView();
  return "";
}

function homeView(){
  const cards = STATE.lines.map(line => {
    const problems = nokCount(line);
    const alert = problems > 0;
    return `
    <div class="group relative text-left rounded-lg border overflow-hidden hover:brightness-110 transition-all cursor-pointer"
         style="background:var(--surface); border-color:var(--border);" data-action="goto-line" data-line="${line.id}">
      <div class="absolute left-0 top-0 bottom-0 w-1" style="background:${alert ? "var(--nok)" : "var(--ok)"};"></div>
      <div class="p-5 pl-6">
        <div class="flex items-start justify-between">
          <div>
            <h2 class="text-xl font-semibold uppercase tracking-wide">${esc(line.name)}</h2>
            <p class="text-sm mt-0.5" style="color:var(--muted);">${esc(line.subtitle||"")}</p>
          </div>
          <div class="flex items-center gap-1 mt-1">
            ${canEdit() ? `
            <span data-action="delete-line" data-line="${line.id}" class="hover:text-white transition-colors p-1" style="color:var(--muted);" aria-label="Supprimer la ligne">
              <i data-lucide="trash-2" width="15" height="15"></i>
            </span>
            <span data-action="open-edit-line" data-line="${line.id}" class="hover:text-white transition-colors p-1" style="color:var(--muted);" aria-label="Modifier la ligne">
              <i data-lucide="pencil" width="15" height="15"></i>
            </span>` : ""}
            <i data-lucide="chevron-right" width="18" height="18" style="color:var(--muted);"></i>
          </div>
        </div>
        <div class="flex items-center justify-between mt-5">
          <span class="text-xs mono" style="color:var(--muted);">${line.postes.length} postes</span>
          ${alert
            ? `<span class="text-xs font-medium px-2 py-1 rounded flex items-center gap-1" style="color:var(--nok); background:rgba(229,72,77,0.12);"><i data-lucide="alert-triangle" width="12" height="12"></i> ${problems} anomalie${problems>1?"s":""}</span>`
            : `<span class="text-xs font-medium px-2 py-1 rounded" style="color:var(--ok); background:rgba(74,222,128,0.12);">Conforme</span>`
          }
        </div>
      </div>
    </div>`;
  }).join("");

  return `<main class="p-5 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">${cards}</main>`;
}

function lineView(){
  const line = findLine(STATE.view.lineId);
  if (!line) return `<main class="p-5">Ligne introuvable.</main>`;
  const tiles = line.postes.map(poste => {
    const alert = posteHasNok(poste);
    const dots = SHIFTS.map(s => {
      const bad = shiftHasNok(poste, s);
      return `<span title="${esc(s)}" class="text-[9px] px-1.5 py-0.5 rounded font-medium mono" style="background:${bad?"rgba(229,72,77,0.15)":"rgba(74,222,128,0.15)"}; color:${bad?"var(--nok)":"var(--ok)"};">${s.replace("Shift ","S")}</span>`;
    }).join("");
    return `
    <div class="rounded-lg border p-4" style="background:var(--surface); border-color:var(--border);">
      <div class="flex items-center justify-between mb-3">
        <span class="flex items-center gap-1.5">
          <h3 class="font-semibold uppercase tracking-wide">${esc(poste.name)}</h3>
          ${canEdit() ? `
          <button data-action="delete-poste" data-line="${line.id}" data-poste="${poste.id}" class="hover:text-white transition-colors p-0.5" style="color:var(--muted);" aria-label="Supprimer le poste">
            <i data-lucide="trash-2" width="13" height="13"></i>
          </button>
          <button data-action="open-edit-poste" data-line="${line.id}" data-poste="${poste.id}" class="hover:text-white transition-colors p-0.5" style="color:var(--muted);" aria-label="Modifier le poste">
            <i data-lucide="pencil" width="13" height="13"></i>
          </button>` : ""}
        </span>
        <div class="flex gap-1">${dots}</div>
      </div>
      <button data-action="goto-poste" data-line="${line.id}" data-poste="${poste.id}"
        class="w-full text-sm border rounded px-3 py-2 flex items-center justify-center gap-2 hover:brightness-110 transition-all"
        style="border-color:${alert?"var(--nok)":"var(--border)"}; color:${alert?"var(--nok)":"var(--text)"};">
        ${alert ? `<i data-lucide="alert-triangle" width="14" height="14"></i>` : ""} Voir les indicateurs
      </button>
    </div>`;
  }).join("");

  const addTile = canEdit() ? `
    <button data-action="open-add-poste" data-line="${line.id}" class="rounded-lg border border-dashed p-4 flex items-center justify-center gap-2 hover:brightness-110 transition-all text-sm"
      style="border-color:var(--border); color:var(--muted);">
      <i data-lucide="plus" width="16" height="16"></i> Ajouter un poste
    </button>` : "";

  return `<main class="p-5 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">${tiles}${addTile}${(!tiles && !addTile) ? `<p style="color:var(--muted);">Aucun poste pour cette ligne.</p>` : ""}</main>`;
}

function posteView(){
  const line = findLine(STATE.view.lineId);
  const poste = findPoste(STATE.view.lineId, STATE.view.posteId);
  if (!line || !poste) return `<main class="p-5">Poste introuvable.</main>`;

  const renderRow = (ind, shift, editable) => {
    const isOk = ind.status === "OK";
    const tag = editable ? "button" : "div";
    const clickAction = isOk ? "request-nok" : "resolve-ok";
    const actionAttr = editable ? `data-action="${clickAction}" data-line="${line.id}" data-poste="${poste.id}" data-shift="${esc(shift)}" data-ind="${ind.id}"` : "";
    return `
    <${tag} ${actionAttr}
      class="flex flex-col rounded-lg border px-4 py-3.5 ${editable ? "hover:brightness-110 cursor-pointer" : ""} transition-all text-left w-full"
      style="background:var(--surface); border-color:${isOk?"var(--border)":"var(--nok)"};">
      <span class="flex items-center justify-between">
        <span class="text-sm font-medium">${esc(ind.name)}</span>
        <span class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full" style="background:${isOk?"var(--ok)":"var(--nok)"}; box-shadow:0 0 10px ${isOk?"var(--ok)":"var(--nok)"};"></span>
          <span class="text-xs font-medium tracking-wider w-8 mono" style="color:${isOk?"var(--ok)":"var(--nok)"};">${ind.status}</span>
        </span>
      </span>
      ${(!isOk && ind.comment) ? `<span class="text-xs mt-1.5" style="color:var(--muted);">« ${esc(ind.comment)} »${ind.openedAt ? ` — depuis ${formatElapsed(ind.openedAt)}` : ""}</span>` : ""}
    </${tag}>`;
  };

  if (STATE.role === "operateur") {
    // L'opérateur consulte tous les shifts mais ne modifie que le shift correspondant à l'heure actuelle
    const cur = currentShift();
    const order = [cur, ...SHIFTS.filter(s => s !== cur)];
    const secs = order.map(s => {
      const mine = s === cur;
      const rows = (poste.shifts[s] || []).map(ind => renderRow(ind, s, mine)).join("");
      return `
      <div class="mb-6">
        <h2 class="text-sm font-semibold uppercase tracking-wide mb-2 flex items-center gap-2" style="color:${mine?"var(--text)":"var(--muted)"};">
          <i data-lucide="clock" width="14" height="14"></i> ${esc(s)}
          <span class="mono text-[10px] font-normal">${shiftHoursLabel(s)}</span>
          <span class="text-[10px] px-1.5 py-0.5 rounded font-medium" style="background:${mine?"rgba(59,130,196,0.2)":"rgba(139,145,152,0.15)"}; color:${mine?"var(--accent)":"var(--muted)"};">${mine ? "Shift en cours · modifiable" : "Lecture seule"}</span>
        </h2>
        <div class="flex flex-col gap-2">${rows}</div>
      </div>`;
    }).join("");
    return `
    <main class="p-5 max-w-xl">
      <p class="text-sm mb-4" style="color:var(--muted);">${esc(cur)} (${shiftHoursLabel(cur)}) — cliquez sur un indicateur OK pour déclarer une anomalie (motif requis), ou sur un NOK pour le résoudre. Les autres shifts sont consultables mais non modifiables.</p>
      ${secs}
    </main>`;
  }

  // Superviseur : lecture seule, les 3 shifts affichés séparément
  const sections = SHIFTS.map(s => `
    <div class="mb-6">
      <h2 class="text-sm font-semibold uppercase tracking-wide mb-2 flex items-center gap-2" style="color:var(--muted);">
        <i data-lucide="clock" width="14" height="14"></i> ${esc(s)}
      </h2>
      <div class="flex flex-col gap-2">${(poste.shifts[s] || []).map(ind => renderRow(ind, s, false)).join("")}</div>
    </div>`).join("");

  return `
  <main class="p-5 max-w-xl">
    <p class="text-sm mb-4" style="color:var(--muted);">Lecture seule — seul l'opérateur du shift concerné peut modifier ces indicateurs.</p>
    ${sections}
  </main>`;
}

function dashboardView(){
  const lines = STATE.lines;
  const anomalies = getAllAnomalies(lines);
  const totalLines = lines.length;
  const totalPostes = lines.reduce((a,l)=>a+l.postes.length,0);
  const totalIndicators = lines.reduce((a,l)=>a+l.postes.reduce((b,p)=>b+posteIndicators(p).length,0),0);
  const totalNok = anomalies.length;
  const conformRate = totalIndicators>0 ? Math.round(((totalIndicators-totalNok)/totalIndicators)*100) : 100;
  const linesSorted = [...lines].sort((a,b)=>nokCount(b)-nokCount(a));

  const sameDay = (isoA, dateB) => {
    const a = new Date(isoA);
    return a.getFullYear()===dateB.getFullYear() && a.getMonth()===dateB.getMonth() && a.getDate()===dateB.getDate();
  };
  const today = new Date();
  const yesterday = new Date(); yesterday.setDate(today.getDate()-1);
  const nokEvents = STATE.history.filter(h => h.action === "NOK");
  const todayCount = nokEvents.filter(h => sameDay(h.ts, today)).length;
  const yesterdayCount = nokEvents.filter(h => sameDay(h.ts, yesterday)).length;
  const diff = todayCount - yesterdayCount;
  const trendCompare = `
    <div class="rounded-lg border p-4 mb-6 flex items-center justify-between" style="background:var(--surface); border-color:var(--border);">
      <div>
        <p class="text-xs mb-1" style="color:var(--muted);">Nouvelles anomalies aujourd'hui vs hier</p>
        <p class="text-lg font-semibold mono">${todayCount} <span class="text-sm" style="color:var(--muted);">vs ${yesterdayCount}</span></p>
      </div>
      <span class="text-xs font-medium px-2 py-1 rounded flex items-center gap-1" style="color:${diff>0?"var(--nok)":diff<0?"var(--ok)":"var(--muted)"}; background:${diff>0?"rgba(229,72,77,0.12)":diff<0?"rgba(74,222,128,0.12)":"transparent"};">
        <i data-lucide="${diff>0?"trending-up":diff<0?"trending-down":"minus"}" width="14" height="14"></i>
        ${diff===0?"Stable":(diff>0?`+${diff}`:diff)}
      </span>
    </div>`;

  const kpis = [
    {label:"Lignes", value: totalLines},
    {label:"Postes", value: totalPostes},
    {label:"Indicateurs suivis", value: totalIndicators},
    {label:"Anomalies actives", value: totalNok, highlight: totalNok>0},
  ].map(k => `
    <div class="rounded-lg border p-4" style="background:var(--surface); border-color:${k.highlight?"var(--nok)":"var(--border)"};">
      <p class="text-2xl font-medium mono" style="color:${k.highlight?"var(--nok)":"var(--text)"};">${k.value}</p>
      <p class="text-xs mt-1" style="color:var(--muted);">${k.label}</p>
    </div>`).join("");

  const lineRows = linesSorted.map(line => {
    const n = nokCount(line);
    return `
    <button data-action="goto-line" data-line="${line.id}" class="flex items-center justify-between rounded-lg border px-4 py-3 hover:brightness-110 transition-all text-left w-full"
      style="background:var(--surface); border-color:${n>0?"var(--nok)":"var(--border)"};">
      <span><span class="text-sm font-medium">${esc(line.name)}</span> <span class="text-xs ml-2" style="color:var(--muted);">${line.postes.length} postes</span></span>
      ${n>0
        ? `<span class="text-xs font-medium px-2 py-1 rounded flex items-center gap-1" style="color:var(--nok); background:rgba(229,72,77,0.12);"><i data-lucide="alert-triangle" width="12" height="12"></i> ${n}</span>`
        : `<span class="text-xs font-medium px-2 py-1 rounded" style="color:var(--ok); background:rgba(74,222,128,0.12);">Conforme</span>`}
    </button>`;
  }).join("");

  const anomalyRows = anomalies.length === 0
    ? `<div class="rounded-lg border p-6 flex flex-col items-center text-center gap-2" style="background:var(--surface); border-color:var(--border); color:var(--muted);">
         <i data-lucide="check-circle-2" width="22" height="22" style="color:var(--ok);"></i>
         <p class="text-sm">Aucune anomalie — toutes les lignes sont conformes.</p>
       </div>`
    : anomalies.map(a => `
      <button data-action="goto-poste" data-line="${a.lineId}" data-poste="${a.posteId}" class="flex items-center justify-between rounded-lg border px-4 py-3 hover:brightness-110 transition-all text-left w-full"
        style="background:var(--surface); border-color:var(--nok);">
        <span class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background:var(--nok); box-shadow:0 0 8px var(--nok);"></span>
          <span class="text-sm font-medium">${esc(a.indicatorName)}</span>
          <span class="text-xs" style="color:var(--muted);">${esc(a.lineName)} · ${esc(a.posteName)} · ${esc(a.shift)}</span>
        </span>
        <i data-lucide="chevron-right" width="16" height="16" style="color:var(--muted);"></i>
      </button>`).join("");

  return `
  <main class="p-5 max-w-4xl">
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">${kpis}</div>
    ${trendCompare}
    <div class="rounded-lg border p-4 mb-6" style="background:var(--surface); border-color:var(--border);">
      <div class="flex items-center justify-between mb-1">
        <span class="text-xs" style="color:var(--muted);">Taux de conformité global</span>
        <span class="text-sm font-medium mono" style="color:${conformRate===100?"var(--ok)":"var(--warn)"};">${conformRate}%</span>
      </div>
      <div class="h-2 rounded-full overflow-hidden" style="background:var(--base);">
        <div class="h-full transition-all" style="width:${conformRate}%; background:${conformRate===100?"var(--ok)":conformRate>=80?"var(--warn)":"var(--nok)"};"></div>
      </div>
    </div>
    <h2 class="text-sm font-semibold uppercase tracking-wide mb-3">État par ligne</h2>
    <div class="flex flex-col gap-2 mb-6">${lineRows}</div>
    <h2 class="text-sm font-semibold uppercase tracking-wide mb-3">Anomalies en cours</h2>
    <div class="flex flex-col gap-2">${anomalyRows}</div>
  </main>`;
}

/* ---------- Statistiques ---------- */
function barChart(title, entries, colorVar){
  // entries: [{label, count}], triés décroissant, affichés en barres horizontales
  const max = Math.max(1, ...entries.map(e => e.count));
  const rows = entries.map(e => `
    <div class="mb-3">
      <div class="flex items-center justify-between text-xs mb-1">
        <span style="color:var(--text);">${esc(e.label)}</span>
        <span class="mono" style="color:var(--muted);">${e.count}</span>
      </div>
      <div class="h-2.5 rounded-full overflow-hidden" style="background:var(--base);">
        <div class="h-full rounded-full transition-all" style="width:${Math.round((e.count/max)*100)}%; background:var(${colorVar});"></div>
      </div>
    </div>`).join("");
  return `
  <div class="rounded-lg border p-4 mb-6" style="background:var(--surface); border-color:var(--border);">
    <h2 class="text-sm font-semibold uppercase tracking-wide mb-4">${esc(title)}</h2>
    ${entries.length === 0
      ? `<p class="text-sm" style="color:var(--muted);">Aucune anomalie à afficher.</p>`
      : rows}
  </div>`;
}

function statsView(){
  const anomalies = getAllAnomalies(STATE.lines);
  const total = anomalies.length;

  const count = (arr, keyFn) => {
    const map = {};
    arr.forEach(a => { const k = keyFn(a); map[k] = (map[k]||0) + 1; });
    return Object.entries(map).map(([label,count])=>({label,count})).sort((a,b)=>b.count-a.count);
  };

  const byLine = count(anomalies, a => a.lineName);
  const byShift = SHIFTS.map(s => ({ label: s, count: anomalies.filter(a=>a.shift===s).length }));
  const byIndicator = count(anomalies, a => a.indicatorName);
  const byPoste = count(anomalies, a => `${a.lineName} · ${a.posteName}`).slice(0,5);

  const worstLine = byLine[0];
  const worstIndicator = byIndicator[0];

  const highlights = total === 0 ? `
    <div class="rounded-lg border p-6 flex flex-col items-center text-center gap-2 mb-6" style="background:var(--surface); border-color:var(--border); color:var(--muted);">
      <i data-lucide="check-circle-2" width="22" height="22" style="color:var(--ok);"></i>
      <p class="text-sm">Aucune anomalie actuellement — rien à cibler.</p>
    </div>` : `
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
      <div class="rounded-lg border p-4" style="background:var(--surface); border-color:var(--nok);">
        <p class="text-xs mb-1 flex items-center gap-1.5" style="color:var(--muted);"><i data-lucide="alert-triangle" width="12" height="12"></i> Ligne la plus touchée</p>
        <p class="text-lg font-semibold">${esc(worstLine.label)}</p>
        <p class="text-xs mono" style="color:var(--nok);">${worstLine.count} anomalie${worstLine.count>1?"s":""}</p>
      </div>
      <div class="rounded-lg border p-4" style="background:var(--surface); border-color:var(--nok);">
        <p class="text-xs mb-1 flex items-center gap-1.5" style="color:var(--muted);"><i data-lucide="alert-triangle" width="12" height="12"></i> Indicateur le plus problématique</p>
        <p class="text-lg font-semibold">${esc(worstIndicator.label)}</p>
        <p class="text-xs mono" style="color:var(--nok);">${worstIndicator.count} occurrence${worstIndicator.count>1?"s":""}</p>
      </div>
    </div>`;

  return `
  <main class="p-5 max-w-4xl">
    <p class="text-sm mb-4" style="color:var(--muted);">${total} anomalie${total>1?"s":""} au total, tous shifts confondus.</p>
    ${highlights}
    ${barChart("Anomalies par ligne", byLine, "--nok")}
    ${barChart("Anomalies par shift", byShift, "--warn")}
    ${barChart("Anomalies par type d'indicateur", byIndicator, "--nok")}
    ${byPoste.length ? barChart("Top 5 des postes les plus critiques", byPoste, "--warn") : ""}
  </main>`;
}

    : entries.map(h => {
        const isNok = h.action === "NOK";
        return `
        <div class="rounded-lg border p-3.5" style="background:var(--surface); border-color:var(--border);">
          <div class="flex items-start justify-between gap-2">
            <span class="flex items-center gap-2">
              <i data-lucide="${isNok ? "alert-triangle" : "check-circle-2"}" width="14" height="14" style="color:${isNok?"var(--nok)":"var(--ok)"};"></i>
              <span class="text-sm font-medium">${esc(h.indicatorName)}</span>
            </span>
            <span class="text-xs mono whitespace-nowrap" style="color:var(--muted);">${formatDateTime(h.ts)}</span>
          </div>
          <p class="text-xs mt-1" style="color:var(--muted);">${esc(h.lineName)} · ${esc(h.posteName)} · ${esc(h.shift)}</p>
          ${isNok
            ? `<p class="text-xs mt-1.5" style="color:var(--nok);">« ${esc(h.comment||"")} »</p>`

      }).join("");

  return `

      <button data-action="export-history-csv" class="text-sm rounded px-3 py-2 flex items-center gap-1.5 hover:brightness-110 border" style="border-color:var(--border); color:var(--text);">

      </button>
    </div>
    <div class="flex flex-col gap-2">${rows}</div>
  </main>`;
}

function exportHistoryCsv(){
  const header = ["Date","Ligne","Poste","Shift","Indicateur","Action","Motif / Durée"];
  const lines = STATE.history.map(h => [
    formatDateTime(h.ts), h.lineName, h.posteName, h.shift, h.indicatorName,
    h.action, h.action==="NOK" ? (h.comment||"") : formatDuration(h.durationMs)
  ]);
  const csvEscape = v => `"${String(v).replace(/"/g,'""')}"`;
  const csv = [header, ...lines].map(row => row.map(csvEscape).join(";")).join("\n");
  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `historique-anomalies-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function modalHtml(){
  const m = STATE.modal;
  if (!m) return "";
  if (m.type === "add-line") return nameModal({ title:"Nouvelle ligne", showSubtitle:true, action:"save-add-line" });
  if (m.type === "edit-line") {
    const l = findLine(m.lineId); if (!l) return "";
    return nameModal({ title:"Modifier la ligne", showSubtitle:true, name:l.name, subtitle:l.subtitle, action:"save-edit-line", lineId:l.id });
  }
  if (m.type === "edit-poste") {
    const p = findPoste(m.lineId, m.posteId); if (!p) return "";
    return nameModal({ title:"Modifier le poste", name:p.name, action:"save-edit-poste", lineId:m.lineId, posteId:m.posteId });
  }
  if (m.type === "add-poste") {
    return nameModal({ title:"Nouveau poste", action:"save-add-poste", lineId:m.lineId });
  }
  if (m.type === "manage-indicators") {
    return manageIndicatorsModal();
  }
  if (m.type === "nok-reason") {
    return nokReasonModal(m.lineId, m.posteId, m.shift, m.indicatorId);
  }
  return "";
}

/* ---------- Câblage des événements (délégation) ---------- */
function wireEvents(){
  document.querySelectorAll("[data-action]").forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const action = el.getAttribute("data-action");
      const lineId = el.getAttribute("data-line");
      const posteId = el.getAttribute("data-poste");
      const indId = el.getAttribute("data-ind");
      const shift = el.getAttribute("data-shift");
      const oldName = el.getAttribute("data-old-name");
      const idx = el.getAttribute("data-idx");

      switch(action){
        case "login-operateur": loginAsOperateur(); break;
        case "login-superviseur":
          tryLoginSuperviseur(document.getElementById("sup-name").value, document.getElementById("sup-code").value);
          break;
        case "login-admin":
          tryLoginAdmin(document.getElementById("adm-email").value, document.getElementById("adm-code").value);
          break;
        case "login-mode": setState({ loginMode: el.getAttribute("data-mode"), loginError: "" }); break;
        case "goto-supervisors":
          navigate(STATE.view.screen==="supervisors" ? {screen:"home", lineId:null, posteId:null} : {screen:"supervisors", lineId:null, posteId:null});
          break;
        case "add-supervisor":
          addSupervisor(document.getElementById("sv-name").value, document.getElementById("sv-code").value);
          break;
        case "delete-supervisor": deleteSupervisor(el.getAttribute("data-id")); break;
        case "choose-shift": chooseShift(shift); break;
        case "confirm-identity": {
          const name = document.getElementById("identify-name").value;
          const email = document.getElementById("identify-email").value;
          confirmIdentity(name, email);
          break;
        }
        case "logout": logout(); break;
        case "back":
          if (STATE.view.screen === "poste") navigate({screen:"line", lineId: STATE.view.lineId, posteId:null});
          else navigate({screen:"home", lineId:null, posteId:null});
          break;
        case "goto-dashboard":
          navigate(STATE.view.screen==="dashboard" ? {screen:"home", lineId:null, posteId:null} : {screen:"dashboard", lineId:null, posteId:null});
          break;
        case "goto-stats":
          navigate(STATE.view.screen==="stats" ? {screen:"home", lineId:null, posteId:null} : {screen:"stats", lineId:null, posteId:null});
          break;
        case "goto-history":
          navigate(STATE.view.screen==="history" ? {screen:"home", lineId:null, posteId:null} : {screen:"history", lineId:null, posteId:null});
          break;
        case "export-history-csv": exportHistoryCsv(); break;
        case "goto-access-log":
          navigate(STATE.view.screen==="access-log" ? {screen:"home", lineId:null, posteId:null} : {screen:"access-log", lineId:null, posteId:null});
          break;
        case "export-access-log-csv": exportAccessLogCsv(); break;
        case "goto-line": navigate({screen:"line", lineId, posteId:null}); break;
        case "goto-poste": navigate({screen:"poste", lineId, posteId}); break;
        case "retry-save": persist(STATE.lines); break;
        case "open-add-line": openModal({type:"add-line"}); break;
        case "open-edit-line": openModal({type:"edit-line", lineId}); break;
        case "delete-line": deleteLine(lineId); break;
        case "open-edit-poste": openModal({type:"edit-poste", lineId, posteId}); break;
        case "open-add-poste": openModal({type:"add-poste", lineId}); break;
        case "delete-poste": deletePoste(lineId, posteId); break;
        case "open-manage-indicators": openModal({type:"manage-indicators"}); break;
        case "add-indicator-type": {
          const input = document.getElementById("new-indicator-name");
          addIndicatorType(input.value);
          input.value = "";
          break;
        }
        case "rename-indicator-type": {
          const input = document.getElementById(`indicator-name-${idx}`);
          renameIndicatorType(oldName, input.value);
          break;
        }
        case "delete-indicator-type": deleteIndicatorType(oldName); break;
        case "close-modal": closeModal(); break;
        case "request-nok": requestNok(lineId, posteId, shift, indId); break;
        case "confirm-nok": {
          const comment = document.getElementById("nok-comment").value;
          confirmNok(lineId, posteId, shift, indId, comment);
          break;
        }
        case "resolve-ok": resolveOk(lineId, posteId, shift, indId); break;
        case "save-add-line": {
          const name = document.getElementById("modal-name").value.trim();
          const subtitle = document.getElementById("modal-subtitle").value.trim();
          if (name) addLine(name, subtitle);
          break;
        }
        case "save-edit-line": {
          const name = document.getElementById("modal-name").value.trim();
          const subtitle = document.getElementById("modal-subtitle").value.trim();
          if (name) renameLine(lineId, name, subtitle);
          break;
        }
        case "save-edit-poste": {
          const name = document.getElementById("modal-name").value.trim();
          if (name) renamePoste(lineId, posteId, name);
          break;
        }
        case "save-add-poste": {
          const name = document.getElementById("modal-name").value.trim();
          if (name) addPoste(lineId, name);
          break;
        }
      }
    };
  });
}

render();

/* Le shift suit l'heure : à chaque changement de shift, l'écran de l'opérateur se met à jour tout seul */
setInterval(() => {
  if (STATE.role === "operateur" && STATE.shift !== currentShift()) { STATE.modal = null; render(); }
}, 30000);

/* ---------- Enregistrement du service worker (offline / installable) ---------- */
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
